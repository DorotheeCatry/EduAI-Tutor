# Services de données du projet EduAI Tutor.
#
# Compétence visée : C4 (épreuve E1) — création de la base de données
# Compétence visée : C13 (épreuve E3) — conteneurisation du service
#
# Choix : PostgreSQL en conteneur plutôt qu'installé sur le système. Motivation :
# la configuration devient une preuve versionnée et lisible par le jury, et
# l'environnement est reproductible à partir du seul dépôt. Une installation
# système ne laisse aucune trace exploitable dans les livrables.
#
# Choix : un volume nommé plutôt qu'un montage de dossier hôte. Motivation :
# le data-root de Docker est déjà dévié vers la grande partition de la machine
# de développement, les données sont donc stockées au bon endroit sans coder
# de chemin absolu dans un fichier destiné à être partagé.
#
# Lancement : docker compose up -d
# Arrêt      : docker compose down          (les données sont conservées)
# Purge      : docker compose down -v       (les données sont supprimées)

services:

  postgres:
    image: postgres:16-alpine
    container_name: eduai_postgres
    restart: unless-stopped

    environment:
      # Valeurs lues depuis le fichier .env, jamais écrites en dur ici :
      # ce fichier est versionné, contrairement à .env.
      POSTGRES_DB: ${POSTGRES_DB:-eduai_data}
      POSTGRES_USER: ${POSTGRES_USER:-eduai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      # Encodage et collation explicites : la base contient du texte français
      # et anglais, une collation par défaut mal choisie fausserait les tris.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Mot de passe du rôle de lecture seule utilisé par l'API du jeu de
      # données (C5). Lu par 06_role_lecture.sh au premier démarrage. Le rôle
      # ne dispose que du SELECT : c'est la garantie de lecture seule tenue par
      # le moteur, celles du routeur Django et des vues vivant dans le code.
      EDUAI_DATA_PASSWORD: ${EDUAI_DATA_PASSWORD:?EDUAI_DATA_PASSWORD doit être défini dans .env}

    ports:
      # Port hôte 5433 et non 5432 : évite le conflit avec une éventuelle
      # instance PostgreSQL déjà installée sur la machine.
      #
      # Publication sur 127.0.0.1 et non sur toutes les interfaces. Sans cette
      # adresse explicite, Docker publie sur 0.0.0.0 : la base serait joignable
      # depuis tout le réseau local, protégée par le seul mot de passe. Le
      # pipeline et l'application s'exécutant sur la machine hôte, aucun accès
      # distant n'est nécessaire — et ce qui n'est pas nécessaire ne s'expose pas.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Les scripts de ce dossier sont exécutés au premier démarrage, dans
      # l'ordre alphabétique. C'est ici que vit le schéma (MPD) du jeu de
      # données, ce qui rend la création de la base reproductible et traçable.
      - ./data_pipeline/load/sql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # Choix : un healthcheck plutôt qu'une simple attente. Motivation :
      # le pipeline d'import doit pouvoir attendre que la base soit réellement
      # prête, pas seulement que le conteneur soit démarré.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduai} -d ${POSTGRES_DB:-eduai_data}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- API REST du service IA (C9, Bloc 2) ---
  #
  # Compétence visée : C9 (épreuve E2) — API REST exposant le service d'IA
  #
  # Choix : un conteneur distinct de l'application Django. Motivation : le
  # référentiel évalue séparément l'API du jeu de données (C5, servie par
  # Django REST Framework) et celle du service IA (C9, ici en FastAPI). Deux
  # conteneurs rendent la séparation lisible et évitent qu'une panne de l'un
  # emporte l'autre. Voir docs/decisions/015.
  service_ia:
    build:
      context: .
      dockerfile: service_ia/Dockerfile
    image: eduai/service-ia:1.0.0
    container_name: eduai_service_ia
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Clés de service acceptées. Aucune valeur de repli : le service refuse
      # tout appel plutôt que d'ouvrir l'accès si la variable manque.
      SERVICE_IA_CLES: ${SERVICE_IA_CLES:?SERVICE_IA_CLES doit être défini dans .env}
      SERVICE_IA_QUOTA_GENERATION: ${SERVICE_IA_QUOTA_GENERATION:-30/minute}
      SERVICE_IA_QUOTA_RECHERCHE: ${SERVICE_IA_QUOTA_RECHERCHE:-120/minute}
      SERVICE_IA_CONCURRENCE_MAX: ${SERVICE_IA_CONCURRENCE_MAX:-4}
      # Plafond journalier de générations, partagé avec l'application web : le
      # budget borné est celui du projet, pas celui de chaque façade prise à
      # part. Le service IA n'applique pas de quota individuel — ses
      # consommateurs sont des programmes, bornés en cadence par clé ci-dessus.
      EDUAI_PLAFOND_GENERATIONS_PAR_JOUR: ${EDUAI_PLAFOND_GENERATIONS_PAR_JOUR:-200}
      # Le service amorce Django pour réutiliser les agents : il lui faut donc
      # les réglages de l'application.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY doit être défini dans .env}
      DJANGO_DEBUG: "False"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      POSTGRES_USER: ${POSTGRES_USER:-eduai}
      POSTGRES_DB: ${POSTGRES_DB:-eduai_data}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${POSTGRES_PORT:-5433}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-eduai_app}
      EDUAI_DATA_PASSWORD: ${EDUAI_DATA_PASSWORD:?EDUAI_DATA_PASSWORD doit être défini dans .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      # Le journal de monitorage est partagé avec le reste du projet : les
      # traces du service IA et celles du pipeline se lisent au même endroit.
      MONITORAGE_REPERTOIRE: /app/data_pipeline/data/monitorage

    volumes:
      # Le corpus vectoriel et les journaux vivent hors de l'image : ils
      # changent sans qu'on reconstruise, et survivent au conteneur.
      #
      # Choix : le corpus vectoriel est monté en écriture, alors qu'il n'est
      # que consulté. Ce n'est pas un relâchement par commodité, c'est un
      # compromis subi. Le montage portait `:ro` — une protection délibérée :
      # le service IA lit le corpus, il n'a aucune raison légitime de le
      # modifier, et un montage en lecture seule empêche par construction
      # qu'une régression ou une injection l'altère. Mais ChromaDB s'appuie
      # sur SQLite, et SQLite écrit sur son fichier même pour une simple
      # lecture : journal WAL, fichier de verrous, index temporaires. Le
      # moteur ne peut donc pas ouvrir la base du tout, et `/ai/recherche`
      # répondait 503 « attempt to write a readonly database ». La protection
      # ne dégradait pas la fonction, elle la rendait impossible.
      #
      # Ce qui est perdu : le conteneur du service IA peut désormais écrire
      # dans `apps/rag/chroma`. Ce qui reste : le corpus est reconstructible
      # par réindexation, il ne contient aucune donnée personnelle, et le
      # service n'expose aucune route d'écriture vers lui. Une alternative
      # existe — faire tourner ChromaDB en serveur séparé, seul détenteur du
      # volume en écriture — mais elle ajoute un service à déployer et sort du
      # périmètre d'ici la soutenance. Voir docs/decisions/018 et
      # docs/incidents/2026-08-29-corpus-vectoriel-monte-en-lecture-seule.md
      - ./apps/rag/chroma:/app/apps/rag/chroma
      - ./data_pipeline/data/monitorage:/app/data_pipeline/data/monitorage

    # Même réseau que le collecteur et PostgreSQL, qui n'écoutent que sur la
    # boucle locale. Le service y est joignable en 127.0.0.1:8100.
    network_mode: host

  # --- Collecteur de métriques (C20, épreuve E5) ---
  #
  # Compétence visée : C20 (épreuve E5) — monitorage du service en production
  #
  # Choix : la configuration est montée depuis le dépôt en lecture seule, et
  # jamais modifiée depuis l'interface. Motivation : une configuration qui ne
  # vit que dans un volume Docker n'est pas dans le dépôt, ne se reproduit pas
  # sur une autre machine, et disparaît au premier « down -v ». Le projet a
  # déjà rencontré cet écart avec des migrations exclues du dépôt.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: eduai_prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Trente jours : la soutenance est à trois semaines, et une rétention
      # plus longue ferait grossir le volume sans servir.
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      # Écoute sur la boucle locale seulement. Avec network_mode: host, le
      # défaut serait 0.0.0.0 et les métriques d'exploitation deviendraient
      # joignables depuis tout le réseau local.
      - --web.listen-address=127.0.0.1:9090

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    # Choix : réseau de l'hôte plutôt que réseau pont.
    #
    # Motivation : le service Django tourne sur la machine et n'écoute que sur
    # 127.0.0.1 — délibérément, pour ne pas s'exposer au réseau local. Depuis un
    # réseau pont, le conteneur voit l'hôte en 172.17.0.1 et se heurte à un
    # « connection refused ». Les deux issues étaient d'exposer Django sur
    # 0.0.0.0, ce qui défait la précaution, ou de partager le réseau de l'hôte.
    # La seconde ne rend rien joignable de plus : les deux conteneurs se lient
    # explicitement à la boucle locale.
    #
    # Limite : network_mode host est propre à Linux. Le projet y tourne, et le
    # jour où le service Django sera lui-même conteneurisé, un réseau pont
    # partagé sera la solution naturelle.
    network_mode: host

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Tableaux de bord (C20, épreuve E5) ---
  #
  # Choix : source de données ET tableau de bord provisionnés depuis des
  # fichiers versionnés. Motivation : un tableau de bord cliqué dans l'interface
  # vit dans la base interne de Grafana, donc dans un volume. Il n'est pas dans
  # le dépôt, aucune relecture n'est possible, et il disparaît au premier
  # « down -v ». Le fichier fait foi — allowUiUpdates est à false pour que les
  # deux ne puissent pas diverger.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: eduai_grafana
    restart: unless-stopped
    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_UTILISATEUR:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_MOT_DE_PASSE:?GRAFANA_MOT_DE_PASSE doit être défini dans .env}
      # Aucune inscription possible, aucun accès anonyme : le tableau de bord
      # décrit l'exploitation du service et le coût des appels.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana appelle son propre dépôt pour proposer des extensions. Le
      # couper évite un appel sortant à chaque démarrage, sans rien retirer.
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Boucle locale seulement, pour la même raison que le collecteur.
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/tableaux:/var/lib/grafana/tableaux:ro
      - grafana_data:/var/lib/grafana

    # Même réseau que le collecteur : Grafana l'atteint alors en 127.0.0.1:9090.
    network_mode: host

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


volumes:
  postgres_data:
    name: eduai_postgres_data

  # Séries temporelles du collecteur. Perdre ce volume perd l'historique des
  # métriques, pas la configuration ni les tableaux de bord — ceux-là sont dans
  # le dépôt. C'est exactement la répartition voulue.
  prometheus_data:
    name: eduai_prometheus_data

  # Base interne de Grafana : comptes et préférences. Ni la source de données
  # ni les tableaux de bord n'en dépendent, ils sont provisionnés au démarrage.
  grafana_data:
    name: eduai_grafana_data
