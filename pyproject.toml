[project]
name = "eduai-tutor"
version = "0.1.0"
description = ""
license = { file = "LICENSE" }
authors = [
    { name = "Dorothée Catry", email = "catrydorothee@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.14"  # Limité pour RestrictedPython et django-tailwind

dependencies = [
    "django >=5.2.4,<6.0.0",
    "djangorestframework >=3.16.0,<4.0.0",
    "django-tailwind[reload] (>=4.0.1,<5.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "chromadb (>=1.0.15,<2.0.0)",
    "langchain (>=0.3.26,<0.4.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "pypdf>=5.7.0,<6.0.0",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "langchain-community (>=0.3.27,<0.4.0)",
    "ollama (>=0.5.1,<0.6.0)",
    "langchain-groq (>=0.3.5,<0.4.0)",
    "channels (>=4.2.2,<5.0.0)",
    "restrictedpython (>=8.0,<9.0)",
    "markdown2 (>=2.5.3,<3.0.0)",
    "groq<1.0.0",
    "requests>=2.32.5",
    "beautifulsoup4>=4.15.0",
    "psycopg[binary]>=3.2,<4.0",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "prometheus-client>=0.26.0",
    "fastapi>=0.115",
    "slowapi>=0.1.9",
    "whitenoise>=6.8,<7.0",
]

# Dépendances du pipeline de données, hors du socle applicatif.
#
# Compétence visée : C13 (épreuve E3) — poids des images de déploiement
# Compétence visée : C1 (épreuve E1) — la source big data reste installable
#
# Choix : PySpark dans un groupe séparé plutôt que dans les dépendances du
# projet. Motivation : il pèse 344 Mio dans l'environnement, et il n'est
# importé que par `data_pipeline/extract/s5_bigdata_stackexchange.py`, exécuté
# hors ligne sur le poste de développement. Aucune requête servie par
# l'application ni par le service IA ne l'atteint. Le transporter dans trois
# images de déploiement revient à payer trois fois un poids qui ne sert nulle
# part en production.
#
# Ce que ce déplacement ne fait pas : il ne retire pas la source big data du
# projet. Elle reste installable, testée, et exigée par C1 — c'est son lieu
# d'installation qui change, pas son existence.

[tool.pytest.ini_options]
# Compétence visée : C18 (épreuve E4) — tests automatisés
#
# Choix : DJANGO_SETTINGS_MODULE déclaré ici plutôt que dans chaque test. Les
# agents, les modèles de l'API données et la sonde de monitorage vivent tous
# dans des applications Django ; les éprouver suppose des réglages chargés.
DJANGO_SETTINGS_MODULE = "eduai_project.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

# Choix : des marqueurs déclarés et « --strict-markers ». Motivation : un
# marqueur mal orthographié devient sinon un test silencieusement non filtré.
# Les tests d'intégration touchent PostgreSQL, le corpus ou le vector store ;
# ils se sautent proprement quand la dépendance manque, plutôt que d'échouer
# en donnant l'impression d'une régression.
markers = [
    "integration: exige PostgreSQL et le schéma de eduai_data",
    "corpus: exige le corpus chargé, non reconstituable en intégration continue",
    "lent: dépasse quelques secondes",
]

[tool.ruff]
# Compétence visée : C18 (épreuve E4) — qualité du code
line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv", "**/migrations", "theme/static_src", "staticfiles",
    "data_pipeline/data",
]

[tool.ruff.lint.per-file-ignores]
# Django et Channels imposent d'appeler get_asgi_application() AVANT d'importer
# ce qui touche à l'ORM : le registre des applications doit être peuplé. L'ordre
# des imports y est contraint par le cadre, non par négligence.
"eduai_project/asgi.py" = ["E402"]

# Trois espaces en fin de ligne y sont situés À L'INTÉRIEUR de prompts
# multilignes envoyés au modèle. Les retirer modifierait le texte transmis au
# fournisseur, pas la mise en forme du code : un linter ne distingue pas du
# code d'un texte d'invite. Ruff les classe d'ailleurs en correction « non
# sûre », et c'est le bon jugement.
"apps/exercises/views.py" = ["W291"]

[tool.ruff.lint]
# Choix : un jeu de règles volontairement restreint. Motivation : le dépôt
# compte plusieurs milliers de lignes écrites avant l'introduction du linter.
# Activer tout le catalogue produirait des milliers de signalements, que
# personne ne lirait — un contrôle qu'on ignore ne contrôle rien. Ces règles-là
# attrapent ce qui casse : import inutilisé, variable non définie, comparaison
# douteuse.
select = ["E4", "E7", "E9", "F", "W291", "W292", "W605"]
ignore = [
    # Les modules d'agents importent pour l'effet de bord de l'amorçage Django.
    "F401",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "eduai_project"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]

pipeline = [
    "pyspark>=3.5,<4.0",
]

[tool.uv]
# `pipeline` et `dev` sont installés par défaut : `uv sync` sans option
# continue de produire l'environnement complet sur le poste de développement
# et en intégration continue. Ce sont les images de déploiement qui s'en
# privent explicitement, par `--no-default-groups` — le retrait est une
# décision écrite dans les Dockerfile, pas l'effet de bord d'une option
# oubliée quelque part.
default-groups = ["dev", "pipeline"]
