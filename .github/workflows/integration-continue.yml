# Intégration continue du projet EduAI Tutor.
#
# Compétence visée : C18 (épreuve E4) — tests automatisés en intégration continue
# Compétence visée : C13 (épreuve E3) — conteneurisation
#
# Quatre travaux. Trois valident, en parallèle et du plus rapide au plus lent :
# la qualité du code, les tests, la construction des deux images. Le quatrième
# livre, et lui seul attend les autres.
#
# Aucun ne porte `continue-on-error` — un contrôle qui ne peut pas faire
# échouer la chaîne ne contrôle rien.
#
# Choix : les trois travaux de validation sont indépendants et s'exécutent en
# parallèle. Motivation : les enchaîner ferait attendre le résultat du linter
# pour savoir si les tests passent, alors que les deux réponses sont utiles
# séparément. Un développeur qui pousse veut voir TOUT ce qui ne va pas, pas la
# première chose.
#
# Choix : la publication, elle, dépend des trois. Motivation : c'est ce que le
# critère C19 demande — l'étape de livraison s'exécute « une fois la ou les
# étapes de packaging validées », donc après, et seulement si elles passent.

# Versions des actions — relevé du 13/09/2026.
#
# Compétence visée : C18 (épreuve E4), C19 (E5)
#
# `actions/checkout` et `astral-sh/setup-uv` étaient restées en v4 et v5, qui
# ciblent Node 20. GitHub a déprécié cet environnement et forçait ces actions
# sur Node 24 en l'annonçant à chaque exécution : rien n'échouait, mais le
# repli disparaîtra.
#
# Les ruptures des versions intermédiaires ont été lues avant de monter, et non
# supposées :
#
#   - `checkout` v5 à v7 durcissent le retrait de sources sur `pull_request_target`
#     et `workflow_run` — deux déclencheurs que ce fichier n'emploie pas. Aucune
#     de ses quatre utilisations ne passe d'argument.
#   - `setup-uv` v8 **cesse de publier les tags majeurs mobiles** : `@v10`
#     n'existe pas, il faut une version complète. v9 fait passer `prune-cache`
#     de vrai à faux, ce qui augmente l'occupation du cache sans rien casser.
#     v10 désactive le cache sur les événements sensibles, qu'on n'emploie pas
#     davantage. Le seul argument passé ici, `enable-cache`, est inchangé.
#
# Deuxième passe, le 13/09 également : les trois actions `docker/` ciblaient
# elles aussi Node 20, et la première montée les avait manquées — elle n'avait
# traité que les deux que l'avertissement nommait, au lieu de faire l'inventaire
# du fichier. C'est le même réflexe qui avait laissé une garde de
# RestrictedPython absente pendant des semaines (incident 021).
#
#   - `build-push-action` v6 → v7, `setup-buildx-action` v3 → v4,
#     `login-action` v3 → v4. Les trois passent à Node 24 dans leur version
#     majeure suivante et **exigent un exécuteur 2.327.1 ou plus récent**, ce
#     que les machines hébergées par GitHub dépassent largement.
#   - Ce qui disparaît ne nous concerne pas : l'entrée `install` de
#     `setup-buildx-action`, les variables `DOCKER_BUILD_NO_SUMMARY` et
#     `DOCKER_BUILD_EXPORT_RETENTION_DAYS` de `build-push-action` — vérifié,
#     aucune n'est employée ici. Les sept entrées que ce fichier passe ont été
#     relues une par une dans les `action.yml` des versions cibles.
#   - Ces trois-là gardent leurs tags majeurs mobiles, contrairement à
#     `setup-uv` : `@v7` et `@v4` se résolvent normalement.

name: Intégration continue

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Lancement manuel, pour rejouer la chaîne sans avoir à pousser un commit.
  workflow_dispatch:

env:
  # Version alignée sur celle du projet (requires-python).
  PYTHON_VERSION: "3.13"

jobs:

  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        # Version COMPLÈTE, et non `@v10` : depuis la version 8, ce dépôt ne
        # publie plus de tag majeur ni mineur mobile. Écrire `@v10` ne
        # résoudrait rien et la chaîne échouerait à l'installation.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen --all-extras --dev

      - name: Analyse statique
        # Le jeu de règles est volontairement restreint et défini dans
        # pyproject.toml : un contrôle qui signale des milliers de lignes n'est
        # pas lu, donc ne contrôle rien.
        run: uv run ruff check .

  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Même version majeure que le conteneur du projet : éprouver sur une
        # autre version ferait passer des tests que la production refuserait.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eduai_data
          POSTGRES_USER: eduai
          POSTGRES_PASSWORD: motdepasse_integration_continue
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U eduai -d eduai_data"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Secrets d'intégration continue, sans valeur hors de ce contexte : la
      # base est créée puis détruite avec le travail. Aucun secret réel n'est
      # nécessaire pour éprouver ce que cette suite éprouve.
      POSTGRES_DB: eduai_data
      POSTGRES_USER: eduai
      POSTGRES_PASSWORD: motdepasse_integration_continue
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      DJANGO_DB_NAME: eduai_app
      DJANGO_SECRET_KEY: cle_django_sans_valeur_hors_integration_continue
      DJANGO_DEBUG: "False"
      EDUAI_DATA_PASSWORD: motdepasse_lecture_integration_continue
      EDUAI_DATA_USER: eduai
      SERVICE_IA_CLES: cle_service_ia_integration_continue
      MONITORAGE_ACTIF: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Installer uv
        # Version COMPLÈTE, et non `@v10` : depuis la version 8, ce dépôt ne
        # publie plus de tag majeur ni mineur mobile. Écrire `@v10` ne
        # résoudrait rien et la chaîne échouerait à l'installation.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen --all-extras --dev

      - name: Installer le client PostgreSQL
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Créer le schéma du jeu de données
        # Les mêmes scripts que ceux montés dans le conteneur du projet, dans le
        # même ordre. Les rejouer ici garantit qu'ils restent exécutables : un
        # schéma qui ne se crée plus depuis zéro n'est pas reproductible, et le
        # jury doit pouvoir monter le projet à partir du seul dépôt.
        env:
          PGPASSWORD: motdepasse_integration_continue
        run: |
          set -euo pipefail
          for script in data_pipeline/load/sql/0[0-4]*.sql; do
            echo "── $script"
            psql -h 127.0.0.1 -p 5433 -U eduai -d eduai_data \
                 -v ON_ERROR_STOP=1 -f "$script"
          done

      - name: Vérifier que le schéma est complet
        # Un contrôle qui échoue bruyamment plutôt qu'une suite de tests qui se
        # sauterait en silence si le schéma n'avait pas été créé.
        env:
          PGPASSWORD: motdepasse_integration_continue
        run: |
          set -euo pipefail
          tables=$(psql -h 127.0.0.1 -p 5433 -U eduai -d eduai_data -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "tables créées : $tables"
          test "$tables" -ge 13

      - name: Exécuter la suite de tests
        # Les tests exigeant le corpus chargé se sautent : reconstituer 6 836
        # documents ici demanderait les dumps et plusieurs heures. Le saut est
        # motivé dans le rapport, il ne passe pas inaperçu.
        run: uv run pytest -v

      - name: Récapitulatif
        if: always()
        run: uv run pytest --collect-only -q 2>/dev/null | tail -3

  image:
    name: Construction et contrôle des images
    runs-on: ubuntu-latest
    # Deux images à valider, et non plus une seule : l'application web est
    # publiée elle aussi depuis le 30/08. Publier une image que rien n'a
    # inspectée reviendrait à supprimer le contrôle au moment où il commence à
    # servir.
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: service IA
            fichier: service_ia/Dockerfile
            etiquette: eduai/service-ia:controle
          - nom: application web
            fichier: Dockerfile
            etiquette: eduai/web:controle
    steps:
      - uses: actions/checkout@v7

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construire l'image — ${{ matrix.nom }}
        # Construction seule, sans publication. C'est l'étape de PACKAGING au
        # sens du critère C19 : elle valide que le Dockerfile reste correct et
        # que les dépendances s'installent. La publication, elle, est un
        # travail distinct qui attend celui-ci — voir `publication`.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.fichier }}
          push: false
          tags: ${{ matrix.etiquette }}-integration-continue
          # Cache porté par le travail : la couche d'installation des
          # dépendances prend 332 secondes mesurées, et n'a pas à être rejouée
          # tant que uv.lock ne change pas.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier ce que l'image embarque — ${{ matrix.nom }}
        # Le .dockerignore avait ramené l'image de 10,1 Go à 5,22 Go, puis le
        # retrait de PySpark, du cache uv et du corpus l'a portée à 1,3 Go. Ce
        # contrôle garde le gain : si l'historique Git ou le vector store
        # réapparaissent, la chaîne échoue au lieu de laisser la taille dériver.
        #
        # Limite connue, et il vaut mieux l'écrire que la laisser croire : le
        # contrôle du vector store ne peut pas échouer ICI, `apps/rag/chroma`
        # étant dans .gitignore donc absent de tout clone. Il garde son sens
        # pour une construction lancée depuis un poste, où le corpus existe.
        run: |
          set -euo pipefail
          docker buildx build --load -f ${{ matrix.fichier }} \
                 -t ${{ matrix.etiquette }} .
          docker run --rm --entrypoint sh ${{ matrix.etiquette }} -c '
            test ! -d /app/.git || { echo "l historique Git est dans l image"; exit 1; }
            test ! -f /app/apps/rag/chroma/chroma.sqlite3 || { echo "le vector store est dans l image"; exit 1; }
            test -d /app/apps/rag/chroma || { echo "le point de montage du corpus est absent"; exit 1; }
            test "$(stat -c %U /app/apps/rag/chroma)" = "eduai" || { echo "le point de montage n appartient pas au compte sans privilege"; exit 1; }
            test "$(stat -c %U /app)" = "eduai" || { echo "/app n appartient pas au compte sans privilege"; exit 1; }
            echo "image conforme"
          '

      - name: Relever la taille de l'image — ${{ matrix.nom }}
        # La taille est une donnée d'exploitation : elle décide du temps de
        # publication et du temps de démarrage chez l'hébergeur. Relevée à
        # chaque exécution, elle rend une dérive visible le jour où elle
        # commence, et non le jour où elle gêne.
        run: |
          TAILLE=$(docker image inspect ${{ matrix.etiquette }} --format '{{.Size}}')
          echo "- **${{ matrix.nom }}** : $((TAILLE / 1024 / 1024)) Mio" >> "$GITHUB_STEP_SUMMARY"

  # --- Étape de livraison ------------------------------------------------
  #
  # Compétence visée : C19 (épreuve E5) — « l'étape de livraison est intégrée
  # et exécutée une fois la ou les étapes de packaging validées »
  # Compétence visée : C13 (épreuve E3) — livraison et déploiement
  #
  # Le déclencheur, en clair, puisque le critère demande qu'il soit
  # identifiable :
  #
  # | Question | Réponse |
  # |---|---|
  # | Sur quel événement ? | une poussée (`push`), ou un lancement manuel |
  # | Sur quelle branche ? | `main` uniquement |
  # | Sous quelle condition ? | les trois travaux précédents au vert |
  # | Avec quel effet ? | deux images publiées au registre, puis redéploiement demandé à l'hébergeur |
  #
  # Choix : `needs` porte les trois travaux, et non le seul `image`.
  # Motivation : publier une image dont les tests échouent reviendrait à
  # livrer ce qu'on vient de constater défaillant. Le packaging valide le
  # contenant, les tests valident le contenu ; la livraison attend les deux.
  #
  # Choix : `main` seulement. Motivation : une branche de chantier publie
  # plusieurs fois par jour un état non fusionné. L'hébergeur servirait alors
  # un code qui n'est dans aucune version de référence, et l'étiquette
  # `:main` ne voudrait plus rien dire.
  publication:
    name: Publication des images et déclenchement du déploiement
    needs: [qualite, tests, image]
    # Deux déclencheurs, et ils ne font pas la même chose.
    #
    # Une poussée sur `main` publie les images ET redéploie : c'est la
    # livraison. Un lancement manuel, depuis n'importe quelle branche,
    # redéploie SANS publier — les étapes de publication sont gardées plus bas
    # sur `main`. Motivation : `:main` doit rester l'image de `main`. Publier
    # cette étiquette depuis une branche ferait servir en production du code
    # qui n'est pas sur `main`, ce qui est précisément le genre d'écart que ce
    # dépôt a déjà documenté deux fois.
    #
    # Le lancement manuel sert donc à deux choses : éprouver le redéploiement
    # avant de fusionner, et remettre en ligne l'image courante sans attendre
    # une livraison.
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # Droits au strict nécessaire : lire le dépôt, écrire les paquets. Le
    # jeton fourni par la chaîne n'a rien d'autre, et notamment pas le droit
    # d'écrire dans le dépôt.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      - name: Ouvrir une session au registre
        # GHCR plutôt qu'un registre tiers : le jeton de la chaîne y donne
        # accès sans qu'aucun secret n'ait à être créé ni renouvelé. Un secret
        # qu'on n'a pas à gérer est un secret qui ne fuit pas.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Établir les noms d'images
        # Le registre exige des noms en minuscules, or le propriétaire du
        # dépôt porte des majuscules. Sans cette conversion, la publication
        # échoue sur un message qui ne dit pas pourquoi.
        id: noms
        run: |
          DEPOT=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "web=ghcr.io/${DEPOT}/web" >> "$GITHUB_OUTPUT"
          echo "service_ia=ghcr.io/${DEPOT}/service-ia" >> "$GITHUB_OUTPUT"
          echo "embarquement=ghcr.io/${DEPOT}/embarquement" >> "$GITHUB_OUTPUT"

      - name: Publier l'image de l'application web
        # Sur `main` seulement : voir la condition du job. Un lancement manuel
        # depuis une branche redéploie l'image en place, il n'en publie pas.
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          # Deux étiquettes, deux usages. `main` est ce que l'hébergeur
          # déploie ; l'empreinte de commit est ce qui permet de dire quelle
          # version tourne, et d'y revenir. Une étiquette mobile seule
          # rendrait tout retour arrière impossible.
          tags: |
            ${{ steps.noms.outputs.web }}:main
            ${{ steps.noms.outputs.web }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publier l'image du service IA
        # Sur `main` seulement : voir la condition du job. Un lancement manuel
        # depuis une branche redéploie l'image en place, il n'en publie pas.
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: service_ia/Dockerfile
          push: true
          tags: |
            ${{ steps.noms.outputs.service_ia }}:main
            ${{ steps.noms.outputs.service_ia }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publier l'image du serveur d'embarquement
        # Sur `main` seulement : voir la condition du job. Un lancement manuel
        # depuis une branche redéploie l'image en place, il n'en publie pas.
        if: github.ref == 'refs/heads/main'
        # Troisième image, et la plus stable : Ollama figé en 0.32.15 avec
        # `mxbai-embed-large` téléchargé à la construction. Elle ne change que
        # si son Dockerfile change, et le cache de la chaîne la reconstruit
        # alors sans retélécharger les 670 Mio du modèle.
        #
        # Elle est publiée quand même à chaque livraison, plutôt qu'une fois à
        # la main : une image du déploiement qui ne passerait pas par la chaîne
        # serait une pièce dont personne ne saurait dire de quelle source elle
        # provient. C'est le service qui embarque chaque requête du RAG — sans
        # lui, aucune recherche documentaire n'aboutit chez l'hébergeur.
        uses: docker/build-push-action@v7
        with:
          context: docker/ollama
          file: docker/ollama/Dockerfile
          push: true
          tags: |
            ${{ steps.noms.outputs.embarquement }}:main
            ${{ steps.noms.outputs.embarquement }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Installer le client de l'hébergeur
        # Version épinglée, comme toutes les actions de cette chaîne : un
        # client qui change de comportement entre deux livraisons rendrait
        # irreproductible l'étape la plus conséquente du fichier.
        run: npm install --global @railway/cli@5.54.0

      - name: Redéployer les services de l'hébergeur
        # L'étape qui met réellement en ligne. Elle a été réécrite le
        # 12/09/2026, et le dossier d'incident 020 puis la réserve 26 disent
        # pourquoi — ce qui vivait ici ne déployait rien.
        #
        # Ce qu'elle faisait : un POST sur une URL secrète, un « crochet de
        # déploiement ». **Railway n'a pas cette fonctionnalité.** Ses webhooks
        # sont SORTANTS : l'hébergeur appelle votre URL pour vous notifier d'un
        # changement d'état. Aucune URL entrante ne déclenche un déploiement ;
        # des « service deploy hooks » figurent sur son forum comme une
        # fonctionnalité demandée, pas disponible. Le secret attendu ne pouvait
        # donc pas exister, et l'étape réussissait en silence.
        #
        # Mesuré le 12/09 : trois images publiées, cette étape en `success`, et
        # les trois identifiants de déploiement inchangés chez l'hébergeur.
        #
        # Choix : un jeton de PROJET (`RAILWAY_TOKEN`), pas un jeton de compte
        # (`RAILWAY_API_TOKEN`). Motivation : sa portée est un seul
        # environnement d'un seul projet, et il ne peut mener que des actions
        # de déploiement. Une compromission de la chaîne expose cet
        # environnement, pas le compte ni les autres projets.
        #
        # Choix : `--from-source`, sans quoi `railway redeploy` rejoue le
        # déploiement EXISTANT, donc l'image existante. C'est le mécanisme même
        # qui avait rendu l'incident 020 invisible.
        #
        # Choix : l'étape ÉCHOUE si rien n'a été déployé. Motivation : c'est la
        # correction de fond. L'ancienne rendait 0 quand le secret manquait,
        # « pour ne pas laisser croire à un déploiement qui n'a pas eu lieu » —
        # sauf qu'un travail vert laisse croire exactement cela. Une livraison
        # qui ne livre pas est un échec, et doit se voir comme tel.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN absent : aucun service ne peut être redéployé."
            echo "Créer un jeton de PROJET depuis les réglages du projet chez" >&2
            echo "l'hébergeur (onglet Tokens), puis le déposer dans les secrets" >&2
            echo "du dépôt sous le nom RAILWAY_TOKEN." >&2
            exit 1
          fi

          # L'identifiant du déploiement courant d'un service.
          #
          # Le client peut écrire une bannière de mise à jour sur la sortie :
          # on ne lit le JSON qu'à partir de sa première accolade.
          identifiant_deploiement() {
            railway service status --service "$1" --json 2>/dev/null \
              | sed -n '/^[[:space:]]*{/,$p' \
              | python3 -c 'import sys, json; print(json.load(sys.stdin).get("deploymentId", ""))'
          }

          echecs=0
          lignes=""

          for service in web service-ai embarquement; do
            avant=$(identifiant_deploiement "$service" || true)
            echo "── ${service} : déploiement courant ${avant:-inconnu}"

            if ! railway redeploy --service "$service" --from-source --yes; then
              echo "::error::${service} : la demande de redéploiement a échoué."
              lignes="${lignes}| \`${service}\` | demande refusée |"$'\n'
              echecs=$((echecs + 1))
              continue
            fi

            # On ne croit pas la commande sur parole : on constate que
            # l'hébergeur a bien ouvert un NOUVEAU déploiement. C'est
            # exactement le contrôle dont l'absence a coûté l'incident 020.
            apres="${avant}"
            for _ in $(seq 1 20); do
              sleep 6
              apres=$(identifiant_deploiement "$service" || true)
              [ -n "${apres}" ] && [ "${apres}" != "${avant}" ] && break
            done

            if [ -z "${apres}" ] || [ "${apres}" = "${avant}" ]; then
              echo "::error::${service} : aucun nouveau déploiement après la demande."
              lignes="${lignes}| \`${service}\` | **inchangé** — rien n'a été déployé |"$'\n'
              echecs=$((echecs + 1))
            else
              echo "${service} : nouveau déploiement ${apres}"
              lignes="${lignes}| \`${service}\` | \`${apres}\` |"$'\n'
            fi
          done

          {
            echo "SERVICES<<FIN_DES_SERVICES"
            printf '%s' "${lignes}"
            echo "FIN_DES_SERVICES"
          } >> "$GITHUB_ENV"

          if [ "${echecs}" -gt 0 ]; then
            echo "DEPLOIEMENT=échoué sur ${echecs} service(s)" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "DEPLOIEMENT=trois services redéployés" >> "$GITHUB_ENV"

      - name: Récapitulatif de la livraison
        # Ce que la chaîne vient de faire, écrit là où on le lira sans dérouler
        # les journaux.
        #
        # Choix : le récapitulatif dit si les images ont été PUBLIÉES, et ne se
        # contente pas de les nommer. Motivation constatée sur son premier
        # lancement manuel : il listait les trois étiquettes `:main` sous un
        # titre « Livraison », alors que les trois publications avaient été
        # sautées — un lecteur en concluait qu'elles venaient d'être produites.
        # Ce dépôt a documenté assez d'étapes vertes disant autre chose que ce
        # qu'elles faisaient pour ne pas en ajouter une.
        if: always()
        env:
          IMAGES_PUBLIEES: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "${IMAGES_PUBLIEES}" = "true" ]; then
            etat_images="publiées par ce lancement"
          else
            etat_images="**non publiées** — lancement hors \`main\`, les services sont redéployés depuis l'étiquette en place"
          fi
          {
            echo "## Livraison"
            echo
            echo "| Élément | Valeur |"
            echo "|---|---|"
            echo "| Déclencheur | \`${{ github.event_name }}\` sur \`${{ github.ref_name }}\` |"
            echo "| Commit de ce lancement | \`${{ github.sha }}\` |"
            echo "| Images | ${etat_images} |"
            echo "| Image application web | \`${{ steps.noms.outputs.web }}:main\` |"
            echo "| Image service IA | \`${{ steps.noms.outputs.service_ia }}:main\` |"
            echo "| Image serveur d'embarquement | \`${{ steps.noms.outputs.embarquement }}:main\` |"
            echo "| Déploiement | ${DEPLOIEMENT:-non atteint} |"
            echo
            if [ -n "${SERVICES:-}" ]; then
              echo "| Service | Déploiement ouvert |"
              echo "|---|---|"
              printf '%s' "${SERVICES}"
              echo
            fi
            echo
            echo "Le corpus vectoriel n'est PAS dans ces images : il est monté"
            echo "depuis un volume persistant, et se met à jour hors ligne."
            echo "Procédure : \`docs/chaine_livraison.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
